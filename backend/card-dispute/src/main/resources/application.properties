spring.application.name=card-dispute

# Conexion SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=card-dispute;encrypt=true;trustServerCertificate=true
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}
spring.datasource.username=db_tm_user
