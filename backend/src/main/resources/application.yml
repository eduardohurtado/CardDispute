spring:
  application:
    name: card-dispute-application
  data:
    jpa:
      repositories:
        enabled: false
  liquibase:
    enabled: false
  mvc:
    problemdetails:
      enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:bankpoc}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

camunda:
  bpm:
    admin-user:
      id: demo
      password: demo
    database:
      type: mssql
      schema-update: true
      schema-name: card_dispute_camunda_schema
      table-prefix: card_dispute_camunda_schema.
    default-serialization-format: application/json
    generic-properties:
      properties:
        history-time-to-live: P1D

management:
  endpoints:
    web:
      exposure:
        # Local POC: only the health endpoint is published (no env, beans, metrics, ...)
        include: health
  endpoint:
    health:
      # Public endpoint: overall UP/DOWN only, no component details
      show-details: never

logging:
  level:
    org.camunda.bpm.engine: info
    org.camunda.bpm: info

application:
  datasource:
    camunda:
      jdbc-url: jdbc:sqlserver://localhost:1433;databaseName=card_dispute_db;encrypt=true;trustServerCertificate=true;
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      username: card_dispute_camunda_login
      password: ${CARD_DISPUTE_CAMUNDA_PASSWORD:changeme}
    card-dispute:
      jdbc-url: jdbc:sqlserver://localhost:1433;databaseName=card_dispute_db;encrypt=true;trustServerCertificate=true;
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      username: card_dispute_business_login
      password: ${CARD_DISPUTE_BUSINESS_PASSWORD:changeme}
    liquibase:
      jdbc-url: jdbc:sqlserver://localhost:1433;databaseName=card_dispute_db;encrypt=true;trustServerCertificate=true;
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      username: card_dispute_liquibase_login
      password: ${CARD_DISPUTE_LIQUIBASE_PASSWORD:changeme}
  liquibase:
    change-log: classpath:liquibase/db/db.changelog-master.yaml
    default-schema: card_dispute_business_schema
    liquibase-schema: card_dispute_liquibase_schema
    # Empty = run everything (db-init + demo-seed). Set to "db-init" to skip synthetic data.
    contexts: ${CARD_DISPUTE_LIQUIBASE_CONTEXTS:}
  cors:
    allowed-origins: ${CARD_DISPUTE_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  notification:
    rabbitmq:
      exchange: ${NOTIFICATION_RABBITMQ_EXCHANGE:card-dispute.events}
      routing-key: ${NOTIFICATION_RABBITMQ_ROUTING_KEY:dispute.resolved.v1}
    outbox:
      enabled: ${NOTIFICATION_OUTBOX_ENABLED:false}
      poll-interval-ms: 10000
      confirm-timeout-seconds: 5
      max-attempts: 5
    worker:
      password-hash: ${NOTIFICATION_WORKER_PASSWORD_HASH:changeme}
  # Synthetic POC rules
  dispute:
    rules:
      eligibility-window: P60D
      duplicate-match-window: PT1H
      review-match-window: PT24H
      manual-review-timeout: ${CARD_DISPUTE_MANUAL_REVIEW_TIMEOUT:PT48H}
      high-value-thresholds:
        COP: 2000000
        USD: 500