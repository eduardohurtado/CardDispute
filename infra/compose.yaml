name: bank-poc

services:
  # =========================================
  # SQL SERVER
  # =========================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bank-poc-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}

    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1433}:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    restart: unless-stopped

  # =========================================
  # RABBITMQ
  # =========================================
  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    container_name: bank-poc-rabbitmq

    # Stable identity across container recreations
    hostname: rabbitmq

    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RabbitMQ user required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RabbitMQ password required}

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

    restart: unless-stopped

  # =========================================
  # RABBITMQ TOPOLOGY INITIALIZATION
  # =========================================
  rabbitmq-topology:
    image: curlimages/curl:8.12.1
    container_name: bank-poc-rabbitmq-topology

    depends_on:
      rabbitmq:
        condition: service_healthy

    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:?RabbitMQ user required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RabbitMQ password required}

    volumes:
      - ./rabbitmq/notification-queue.json:/config/notification-queue.json:ro

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |
        AUTH="$${RABBITMQ_USER}:$${RABBITMQ_PASSWORD}"
        API="http://rabbitmq:15672/api"

        echo "Creating RabbitMQ exchange..."

        curl -sS --fail-with-body --retry 10 --retry-delay 2 \
          -u "$$AUTH" \
          -H "Content-Type: application/json" \
          -X PUT \
          "$$API/exchanges/%2F/card-dispute.events" \
          -d '{"type":"topic","durable":true,"auto_delete":false,"internal":false,"arguments":{}}'

        echo "Creating RabbitMQ queue..."

        curl -sS --fail-with-body --retry 10 --retry-delay 2 \
          -u "$$AUTH" \
          -H "Content-Type: application/json" \
          -X PUT \
          "$$API/queues/%2F/card-dispute.notifications" \
          --data-binary @/config/notification-queue.json

        echo "Creating RabbitMQ binding..."

        curl -sS --fail-with-body --retry 10 --retry-delay 2 \
          -u "$$AUTH" \
          -H "Content-Type: application/json" \
          -X POST \
          "$$API/bindings/%2F/e/card-dispute.events/q/card-dispute.notifications" \
          -d '{"routing_key":"dispute.#","arguments":{}}'

        echo "RabbitMQ topology initialized successfully."

    restart: "no"

  # =========================================
  # NESTJS NOTIFICATION WORKER
  # =========================================
  notifications:
    build:
      context: ../notifications
      dockerfile: ../infra/dockerfiles/notifications.Dockerfile

    container_name: bank-poc-notifications

    environment:
      NODE_ENV: production

      RABBITMQ_CONNECTION_STRING: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_QUEUE_NAME: card-dispute.notifications
      RABBITMQ_EXCHANGE_NAME: card-dispute.events
      RABBITMQ_ROUTING_KEY: dispute.#
      BACKEND_BASIC_AUTH_PASSWORD: ${NOTIFICATION_WORKER_PASSWORD_HASH:?Backend auth password required}
      BACKEND_API_BASE_URL: ${NOTIFICATIONS_BACKEND_API_BASE_URL:-http://backend:8080}

    depends_on:
      rabbitmq:
        condition: service_healthy

    restart: unless-stopped

  # =========================================
  # SPRING BOOT BACKEND
  # =========================================
  backend:
    build:
      context: ../backend
      dockerfile: ../infra/dockerfiles/backend.Dockerfile

    image: bank-poc-backend:local
    container_name: bank-poc-backend

    environment:
      DB_HOST: sqlserver
      DB_PORT: "1433"

      CARD_DISPUTE_CAMUNDA_PASSWORD: ${CAMUNDA_DB_PASSWORD:?Camunda password required}
      CARD_DISPUTE_BUSINESS_PASSWORD: ${BUSINESS_DB_PASSWORD:?Business password required}
      CARD_DISPUTE_LIQUIBASE_PASSWORD: ${LIQUIBASE_DB_PASSWORD:?Liquibase password required}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:?RabbitMQ user required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RabbitMQ password required}
      RABBITMQ_VHOST: "/"

      NOTIFICATION_OUTBOX_ENABLED: "false"
      NOTIFICATION_WORKER_PASSWORD_HASH: ${NOTIFICATION_WORKER_PASSWORD_HASH:?Notification worker password required}

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

    restart: unless-stopped

  # =========================================
  # DATABASE INITIALIZATION
  # =========================================
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest

    depends_on:
      sqlserver:
        condition: service_started

    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Password required}
      CAMUNDA_DB_PASSWORD: ${CAMUNDA_DB_PASSWORD:?Password required}
      BUSINESS_DB_PASSWORD: ${BUSINESS_DB_PASSWORD:?Password required}
      LIQUIBASE_DB_PASSWORD: ${LIQUIBASE_DB_PASSWORD:?Password required}

    volumes:
      - ./db/init.sh:/init.sh:ro
      - ./db/scripts:/scripts:ro

    entrypoint:
      - /bin/bash
      - /init.sh

    restart: "no"

  # =========================================
  # React SPA
  # =========================================
  frontend:
    container_name: bank-poc-frontend
    build:
      context: ../frontend
      dockerfile: ../frontend/Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - 3000:3000
    restart: unless-stopped

volumes:
  sqlserver_data:
  rabbitmq_data:
