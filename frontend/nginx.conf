# defines how the application is served and is placed in the conf.d directory

server {
    listen 3000; 
    root /usr/share/nginx/html;
    index index.html;

    # Security: Hides Nginx version
    server_tokens off;

    # SPA Routing: Directs all unmatched requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security: Block access to hidden files
    location ~ /\. {
        deny all;
    }
}